<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-rose card-header-icon">
            <div class="card-icon">
              <i class="material-icons">assignment</i>
            </div>
            <h4 class="card-title">Servicio</h4>
            <br />
            <button mat-raised-button matTooltip="Volver" class="btn btn-warning btn-sm" routerLink="/adm_servicio/servicios">
              <span class="btn-label"></span>
              Volver
            </button>
          </div>
          <div class="card-body">
            <div *ngIf="!loading">
              <h3 id="titulo1">
                <strong>Datos </strong>
              </h3>
              <div class="row col-md-4 offset-md-4">
                <div class="col-md-12 col-sm-12">
                  <div class="fileinput fileinput-new text-center" data-provides="fileinput">
                    <div class="fileinput-new thumbnail">
                      <img [src]="url_short + servicio.imagen" alt="..." />
                    </div>
                    <div class="fileinput-preview fileinput-exists thumbnail"></div>
                  </div>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Nombre</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ servicio.nombre }}</label>
                </div>

                <div class="col-xs-12 col-md-6">
                  <label id="label1">Precio</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ servicio.precio }}</label>
                </div>

                <div class="col-xs-12 col-md-6">
                  <label id="label1">Estado</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>
                    {{ servicio.estado == 1 ? 'Activo' : 'Inactivo' }}
                  </label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Descripción</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ servicio.descripcion }}</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
