<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-rose card-header-icon">
            <div class="card-icon">
              <i class="material-icons">assignment</i>
            </div>
            <h4 class="card-title">Reserva</h4>
            <br />
            <button mat-raised-button matTooltip="Volver" class="btn btn-warning btn-sm" (click)="volver()">
              <span class="btn-label"></span>
              Volver
            </button>
            <button
              mat-raised-button
              style="float: right"
              matTooltip="Crear Observación"
              data-toggle="modal"
              data-target="#createModal"
              class="btn btn-info btn-sm"
            >
              Agregar Observación
            </button>
            <div style="text-align: center">
              <button
                *ngIf="reserva?.estado == 3"
                mat-raised-button
                matTooltip="Aprobar"
                (click)="aprobar(reserva?.id)"
                class="btn btn-success btn-sm"
              >
                Aprobar
              </button>
              <button
                *ngIf="reserva?.estado == 2"
                mat-raised-button
                matTooltip="Finalizar"
                (click)="finalizar(reserva.id)"
                class="btn btn-warning btn-sm"
              >
                Finalizar
              </button>
              <button
                *ngIf="reserva?.estado == 3 || reserva?.estado == 2"
                mat-raised-button
                matTooltip="Rechazar"
                (click)="rechazar(reserva.id)"
                class="btn btn-danger btn-sm"
              >
                Rechazar
              </button>
            </div>
          </div>
          <div class="card-body">
            <div *ngIf="!loading">
              <h3 id="titulo1">
                <strong>Información Reserva </strong>
              </h3>
              <div class="row col-md-4 offset-md-4">
                <div class="col-xs-12 col-md-6">
                  <label id="label1">N° Orden</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ reserva.orden }}</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Servicio</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label >{{ reserva.servicio.nombre }}</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Cantidad</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label >{{ reserva.cantidad }}</label>
                </div>

                <div class="col-xs-12 col-md-6">
                  <label id="label1">Precio Servicio</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ reserva.precio | currency: 'USD':'symbol':'1.0' }}</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Precio Total</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ reserva.precio_total | currency: 'USD':'symbol':'1.0' }}</label>
                </div>

                <div class="col-xs-12 col-md-6">
                  <label id="label1">Estado</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>
                    {{ reserva.estado | estado }}
                  </label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Fecha Solicitud</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ reserva.fecha_creacion | date: 'dd/MM/yyyy HH:mm' }}</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Fecha Reserva</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ reserva.fecha_reserva | date: 'dd/MM/yyyy' }}</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Horario</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ reserva.hora_inicio }} - {{ reserva.hora_fin }}</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label id="label1">Pagado</label>
                </div>
                <div class="col-xs-12 col-md-6">
                  <label>{{ reserva.pagado ? 'Si' : 'No' }}</label>
                </div>
                <div class="row" *ngIf="reserva.extra_lavado">
                  <h4 class="col-md-12 col-xs-12" id="titulo2">Datos Vehículo</h4>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Tipo</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra_lavado.tipo }}</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Marca</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra_lavado.marca }}</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Modelo</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra_lavado.modelo }}</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Patente</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra_lavado.patente }}</label>
                  </div>
                  <h4 class="col-md-12 col-xs-12" id="titulo2">Datos Extra</h4>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Dirección</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra_lavado.direccion }}</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Celular</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra_lavado.celular }}</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Recibe</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra_lavado.recibe }}</label>
                  </div>
                </div>
                <div class="row" *ngIf="!reserva.extra_lavado">
                  <h4 class="col-md-12 col-xs-12" id="titulo2">Datos Extra</h4>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Dirección</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra.direccion }}</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Celular</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra.celular }}</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label id="label1">Recibe</label>
                  </div>
                  <div class="col-xs-12 col-md-6">
                    <label>{{ reserva.extra.recibe }}</label>
                  </div>
                </div>
              </div>
            </div>
            <br />
            <div *ngIf="!loading">
              <div *ngIf="reserva.observaciones.length > 0">
                <h5 >Observaciones:</h5>
                <li *ngFor="let ob of reserva.observaciones">
                  {{ ob.observacion }}
                </li>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CREATE MODAL -->
<div class="modal fade" id="createModal" tabindex="-1" role="dialog" data-backdrop="static" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-notice">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="myModalLabel">Crear Observación</h5>
        <button mat-button type="button" class="close" data-dismiss="modal" aria-hidden="true">
          <i class="material-icons">close</i>
        </button>
      </div>
      <div class="modal-body">
        <form #f1="ngForm" (submit)="crearObservacion(f1.valid)">
          <mat-form-field class="example-full-width">
            <input
              matInput
              placeholder="Observación"
              name="observacion"
              #observacion="ngModel"
              [(ngModel)]="observacionModel.observacion"
              required
              type="text"
            />
            <small [hidden]="observacion.valid || (observacion.pristine && !f1.submitted)" class="text-danger"> Observación es requerido. </small>
          </mat-form-field>
          <div class="modal-footer justify-content-center">
            <button mat-raised-button type="submit" class="btn btn-info btn-round">Crear Observación</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- end CREATE MODAL-->
