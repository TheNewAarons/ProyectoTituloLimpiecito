<div class="row">
  <div class="col-md-12">
    <mat-form-field  >
    <mat-select  placeholder="Seleccionar Sector" [(ngModel)]="id_sector"  required>
        <mat-option *ngFor="let sector of sectores"  [value]="sector.id">
        {{ sector.nombre }}
        </mat-option>
    </mat-select>
    </mat-form-field>
    <mat-error *ngIf="!id_sector">Sector es Requerido</mat-error>
  </div>
</div>
<form  [formGroup]="areaForm">
  <div class="row">
      <div class="col-md-8">
          <mat-form-field class="example-full-width">
              <input
              type="text"
              matInput
              placeholder="Nombre de la Àrea"
              formControlName="nombre"
              required>
          </mat-form-field>
          <mat-error *ngIf="form.nombre?.errors?.required && form.nombre.touched">Nombre es Requerido</mat-error>
      </div>
      <div class="col-md-4">
        <mat-form-field>
        <mat-select placeholder="Estado Inicial" name="estado" formControlName="estado" required>
            <mat-option *ngFor="let estado of estados"  [value]="estado.value">
            {{ estado.nombre }}
            </mat-option>
        </mat-select>
        </mat-form-field>
        <mat-error *ngIf="form.estado?.errors?.required && form.estado.touched">estado es Requerido</mat-error>
    </div>
  </div>
  <!-- APARTADO DE BOTONES -->
  <div class="card-footer text-right">
    <div class="form-group">
      <button *ngIf="!flag_editar" [disabled]="!areaForm.valid" mat-raised-button type="submit" class="btn btn-rose btn-sm btn-fill btn-wd" (click)="registrar()">Registrar</button>
      <button *ngIf="flag_editar" [disabled]="!areaForm.valid" mat-raised-button type="submit" class="btn btn-warning btn-sm btn-fill btn-wd" (click)="registrar()">Editar</button>
    </div>
  </div>
</form>
