<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-rose card-header-icon">
            <div class="card-icon">
              <i class="material-icons">assignment</i>
            </div>
            <h4 class="card-title">Categorias</h4>
            <br />
            <button mat-raised-button matTooltip="Crear Categoria" class="btn btn-warning btn-sm" routerLink="/archivo/crear-categoria">
              <span class="btn-label">
                <i class="material-icons">add</i>
              </span>
              Crear
            </button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <!-- TABLE RESPONSIVE -->
              <table class="table">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Tipo</th>
                    <th class="text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let categoria of categorias | slice: (page - 1) * pageSize:(page - 1) * pageSize + pageSize">
                    <td>{{ categoria.nombre }}</td>
                    <td>{{ categoria.descripcion }}</td>
                    <td>{{ categoria.tipo }}</td>
                    <td class="td-actions text-right">
                      <button
                        *ngIf="usuario.role.nombre !== 'LVL_ARCHIVO'"
                        mat-raised-button
                        type="button"
                        matTooltip="Editar Categoria"
                        class="btn btn-success btn-round"
                        data-toggle="modal"
                        data-target="#editModal"
                        (click)="asignarEditar(categoria)"
                      >
                        <i class="material-icons">edit</i>
                      </button>
                      <button
                        *ngIf="usuario.role.nombre !== 'LVL_ARCHIVO'"
                        mat-raised-button
                        type="button"
                        matTooltip="Eliminar Categoria"
                        class="btn btn-danger btn-round"
                        (click)="eliminarCategoria(categoria.id)"
                      >
                        <i class="material-icons">close</i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <ngb-pagination
                [(page)]="page"
                [pageSize]="pageSize"
                [collectionSize]="categorias?.length"
                [maxSize]="5"
                [rotate]="true"
                [boundaryLinks]="true"
              >
              </ngb-pagination>
            </div>
            <!-- END TABLE RESPONSIVE-->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1" role="dialog" data-backdrop="static" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-notice">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="myModalLabel">Editar Categoria</h5>
        <button mat-button type="button" class="close" data-dismiss="modal" aria-hidden="true">
          <i class="material-icons">close</i>
        </button>
      </div>
      <div class="modal-body">
        <form #f2="ngForm" (submit)="editarCategoria(f2.valid)">
          <mat-form-field class="example-full-width">
            <input matInput placeholder="Nombre" name="nombre" #nombre="ngModel" [(ngModel)]="categoriaEdit.nombre" required type="text" />
            <small [hidden]="nombre.valid || (nombre.pristine && !f2.submitted)" class="text-danger">
              Nombre es requerido.
            </small>
          </mat-form-field>
          <mat-form-field class="example-full-width">
            <input
              matInput
              placeholder="Descripción"
              name="descripcion"
              #descripcion="ngModel"
              [(ngModel)]="categoriaEdit.descripcion"
              required
              type="text"
            />
          </mat-form-field>
          <ng-select
            style="padding: 0px 0px 20px !important;"
            class="col-lg-12 col-md-12"
            required
            name="tipo"
            #tipo="ngModel"
            [items]="tipos"
            [(ngModel)]="categoriaEdit.tipo"
            [clearable]="false"
          >
          </ng-select>
          <div class="modal-footer justify-content-center">
            <button mat-raised-button type="submit" class="btn btn-info btn-round">
              Editar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- end EDIT MODAL-->
