<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-rose card-header-icon">
            <div class="card-icon">
              <i class="material-icons">assignment</i>
            </div>
            <h4 class="card-title">Crear Categoria</h4>
            <br />
            <button mat-raised-button matTooltip="Volver" class="btn btn-warning btn-sm" routerLink="/archivo/categorias">
              <span class="btn-label"></span>
              Volver
            </button>
          </div>
          <div class="card-body">
            <form #f1="ngForm" (submit)="crearCategoria(f1.valid)">
              <mat-form-field class="example-full-width">
                <input matInput placeholder="Nombre" name="nombre" #nombre="ngModel" [(ngModel)]="categoria.nombre" required type="text" />
                <small [hidden]="nombre.valid || (nombre.pristine && !f1.submitted)" class="text-danger">
                  Nombre es requerido.
                </small>
              </mat-form-field>
              <mat-form-field class="example-full-width">
                <input
                  matInput
                  placeholder="Descripción"
                  name="descripcion"
                  #descripcion="ngModel"
                  [(ngModel)]="categoria.descripcion"
                  required
                  type="text"
                />
                <small [hidden]="descripcion.valid || (descripcion.pristine && !f1.submitted)" class="text-danger">
                  Descripción es requerido.
                </small>
              </mat-form-field>
              <!-- <mat-form-field class="example-full-width">
                <input matInput placeholder="Tipo" name="tipo" #tipo="ngModel" [(ngModel)]="categoria.tipo" type="text" />
              </mat-form-field> -->
              <ng-select
                id="sele"
                class="col-lg-12 col-md-12"
                required
                name="tipo"
                #tipo="ngModel"
                [items]="tipos"
                [(ngModel)]="categoria.tipo"
                placeholder="Tipo.."
              >
              </ng-select>
              <div class="modal-footer justify-content-center">
                <button mat-raised-button type="submit" class="btn btn-info btn-round">
                  Crear
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
