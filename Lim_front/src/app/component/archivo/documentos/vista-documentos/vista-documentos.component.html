<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-rose card-header-icon">
            <div class="card-icon">
              <i class="material-icons">assignment</i>
            </div>
            <h4 class="card-title">Documentos</h4>
            <br />
            <button mat-raised-button matTooltip="Crear Documento" class="btn btn-warning btn-sm" routerLink="/archivo/crear-documento">
              <span class="btn-label">
                <i class="material-icons">add</i>
              </span>
              Crear
            </button>
          </div>
          <div class="card-body">
            <ng-select
              style="padding: 7px 0px;"
              class="col-lg-3 col-md-3 col-sm-12"
              [items]="categorias"
              [(ngModel)]="categoria"
              placeholder="Categoria.."
              [loading]="categoriasListo"
              [clearable]="false"
              (change)="buscar()"
            >
            </ng-select>
            <!-- BUSCADOR -->
            <div class="input-group no-border">
              <input type="text" name="search" class="form-control" [(ngModel)]="search" placeholder="Buscar..." (change)="buscar()" />
            </div>
            <div class="table-responsive">
              <!-- TABLE RESPONSIVE -->
              <table class="table">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Fecha subida</th>
                    <th>Categoria</th>
                    <th class="text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let documento of documentos | slice: (page - 1) * pageSize:(page - 1) * pageSize + pageSize">
                    <td>{{ documento.nombre }}</td>
                    <td>{{ documento.fecha_subida | date: 'dd/MM/yyyy' }}</td>
                    <td>
                      {{ documento.categoria_documento.nombre }}
                    </td>
                    <td class="td-actions text-right">
                      <button
                        *ngIf="usuario.role.nombre !== 'LVL_ARCHIVO'"
                        mat-raised-button
                        type="button"
                        matTooltip="Editar Documento"
                        class="btn btn-success btn-round"
                        data-toggle="modal"
                        data-target="#editModal"
                        (click)="asignarEditar(documento)"
                      >
                        <i class="material-icons">edit</i>
                      </button>
                      <button
                        mat-raised-button
                        type="button"
                        matTooltip="Ver Documento"
                        class="btn btn-info btn-round"
                        [routerLink]="['/archivo/ver-documento/', documento.id]"
                      >
                        <i class="material-icons">remove_red_eye</i>
                      </button>
                      <button
                        *ngIf="documento.categoria_documento.tipo === 'Personalizado'"
                        mat-raised-button
                        type="button"
                        matTooltip="Asociar Documento"
                        class="btn btn-warning btn-round"
                        [routerLink]="['/archivo/documento/crear-asociacion/', documento.id]"
                      >
                        <i class="material-icons">compare_arrows</i>
                      </button>
                      <button
                        *ngIf="usuario.role.nombre !== 'LVL_ARCHIVO'"
                        mat-raised-button
                        type="button"
                        matTooltip="Eliminar Documento"
                        class="btn btn-danger btn-round"
                        (click)="eliminarDocumento(documento.id)"
                      >
                        <i class="material-icons">close</i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <ngb-pagination
                [(page)]="page"
                [pageSize]="pageSize"
                [collectionSize]="documentos?.length"
                [maxSize]="5"
                [rotate]="true"
                [boundaryLinks]="true"
              >
              </ngb-pagination>
            </div>
            <!-- END TABLE RESPONSIVE-->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1" role="dialog" data-backdrop="static" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-notice">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="myModalLabel">Editar Documento</h5>
        <button mat-button type="button" class="close" data-dismiss="modal" aria-hidden="true">
          <i class="material-icons">close</i>
        </button>
      </div>
      <div class="modal-body">
        <form #f2="ngForm" (submit)="editarDocumento(f2.valid)">
          <mat-form-field class="example-full-width">
            <input matInput placeholder="Nombre" name="nombre" #nombre="ngModel" [(ngModel)]="documentoEdit.nombre" required type="text" />
            <small [hidden]="nombre.valid || (nombre.pristine && !f2.submitted)" class="text-danger">
              Nombre es requerido.
            </small>
          </mat-form-field>
          <ng-select
            style="padding: 0px 0px 20px !important;"
            class="col-lg-12 col-md-12"
            required
            name="categoriaDocumentoId"
            #categoriaDocumentoId="ngModel"
            [items]="preCategorias"
            bindLabel="nombre"
            bindValue="id"
            [(ngModel)]="documentoEdit.categoriaDocumentoId"
            placeholder="Categoria.."
            [loading]="categoriasListo"
            [clearable]="false"
          >
          </ng-select>
          <div class="modal-footer justify-content-center">
            <button mat-raised-button type="submit" class="btn btn-info btn-round">
              Editar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- end EDIT MODAL-->
