<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-rose card-header-icon">
            <div class="card-icon">
              <i class="material-icons">assignment</i>
            </div>
            <h4 class="card-title">Crear Documento</h4>
            <br />
            <button mat-raised-button matTooltip="Volver" class="btn btn-warning btn-sm" routerLink="/archivo/documentos">
              <span class="btn-label"></span>
              Volver
            </button>
          </div>
          <div class="card-body">
            <form #f1="ngForm" (submit)="crearDocumento(f1.valid)">
              <mat-form-field class="example-full-width">
                <input matInput placeholder="Nombre" name="nombre" #nombre="ngModel" [(ngModel)]="documento.nombre" required type="text" />
                <small [hidden]="nombre.valid || (nombre.pristine && !f1.submitted)" class="text-danger">
                  Nombre es requerido.
                </small>
              </mat-form-field>
              <input type="file" #fo name="fo" (change)="pdfSelecionado($event)" required />
              <small [hidden]="file" class="text-danger">
                Archivo es requerido.
              </small>
              <ng-select
                style="padding: 0px 0px 20px !important;"
                class="col-lg-12 col-md-12"
                required
                name="categoriaDocumentoId"
                #categoriaDocumentoId="ngModel"
                [items]="categorias"
                bindLabel="nombre"
                bindValue="id"
                [(ngModel)]="documento.categoriaDocumentoId"
                placeholder="Categoria.."
                [loading]="categoriasListo"
              >
              </ng-select>
              <div class="modal-footer justify-content-center">
                <button mat-raised-button type="submit" class="btn btn-info btn-round">
                  Crear
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
