<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card">
          <div class="card-header card-header-rose card-header-icon">
            <div class="card-icon"><i class="material-icons">list_alt</i></div>
            <h4 class="card-title">Nueva Solicitud De Insumos / EPP</h4>
          </div>
          <div class="card-body">
            <div class="text-center" *ngIf="loading"><app-loading></app-loading></div>
            <form #f="ngForm" *ngIf="!loading" (submit)="guardar()">
              <div class="row">
                <div class="col-12">
                  <mat-form-field class="example-full-width">
                    <mat-select placeholder="Centro De Costo" name="centro" [(ngModel)]="centroId" required>
                      <mat-option *ngFor="let c of centros" [value]="c.id">{{ etiquetaCentro(c) }}</mat-option>
                    </mat-select>
                  </mat-form-field>
                  <small class="text-danger" *ngIf="centros.length === 0">No hay centros de costo abiertos disponibles.</small>
                </div>
              </div>

              <div class="row align-items-end">
                <div class="col-12 col-sm-7">
                  <label class="mb-0">Producto</label>
                  <ng-select [items]="productos" bindLabel="nombre" name="producto" [(ngModel)]="producto"
                    placeholder="Buscar producto..." notFoundText="Sin resultados" [clearable]="true"></ng-select>
                </div>
                <div class="col-6 col-sm-3">
                  <mat-form-field class="example-full-width">
                    <input matInput type="number" inputmode="numeric" pattern="[0-9]*" min="1" step="1"
                      placeholder="Cantidad" name="cantidad" [(ngModel)]="cantidad" (keydown.enter)="$event.preventDefault(); agregar()">
                  </mat-form-field>
                </div>
                <div class="col-6 col-sm-2 text-right">
                  <button mat-raised-button type="button" matTooltip="Agregar Producto" class="btn btn-warning btn-block" (click)="agregar()">
                    <i class="material-icons">add</i>
                  </button>
                </div>
                <div class="col-12"><small class="text-danger" *ngIf="errorLinea">{{ errorLinea }}</small></div>
              </div>

              <div class="table-responsive mt-2">
                <table class="table">
                  <thead>
                    <tr>
                      <th class="text-left">Producto</th>
                      <th class="text-right">Cantidad</th>
                      <th class="text-right">Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngIf="lineas.length === 0">
                      <td colspan="3" class="text-center">Sin productos agregados</td>
                    </tr>
                    <tr *ngFor="let l of lineas; let i = index">
                      <td class="text-left">{{ l.producto.nombre }}</td>
                      <td class="text-right">{{ l.cantidad | number:'1.0-0' }}</td>
                      <td class="td-actions text-right">
                        <button mat-raised-button type="button" matTooltip="Quitar" class="btn btn-danger btn-round" (click)="quitar(i)">
                          <i class="material-icons">close</i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <mat-form-field class="example-full-width">
                <textarea matInput placeholder="Observación (opcional)" name="observacion" maxlength="500" rows="2" [(ngModel)]="observacion"></textarea>
              </mat-form-field>

              <div class="text-right">
                <button mat-raised-button type="button" class="btn btn-danger mr-1 mb-2" (click)="cancelar()">Cancelar</button>
                <button mat-raised-button type="submit" class="btn btn-success mb-2" [disabled]="!puedeEnviar()">
                  <span class="btn-label"><i class="material-icons">save</i></span>
                  Enviar Solicitud
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
